<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <link rel="shortcut icon" href="data:," />
    <link rel="apple-touch-icon" href="data:," />
    <title>Assay</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #0c0e13;
        --panel: rgba(255, 255, 255, 0.045);
        --panel-strong: rgba(255, 255, 255, 0.075);
        --line: rgba(255, 255, 255, 0.11);
        --ink: #e8ecf4;
        --muted: rgba(232, 236, 244, 0.62);
        --faint: rgba(232, 236, 244, 0.4);
        --clear: #4ec99a;
        --adverse: #f2685f;
        --unknown: #e3b155;
        --idle: rgba(232, 236, 244, 0.3);
        --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial;
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 18px; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.5; }
      h1, h2, h3 { margin: 0; font-weight: 600; letter-spacing: -0.01em; }
      h1 { font-size: 19px; }
      h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.07em; color: var(--muted); }
      .card { border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 16px; margin-bottom: 14px; }
      .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
      .spread { display: flex; justify-content: space-between; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
      .mono { font-family: var(--mono); font-size: 12px; word-break: break-all; }
      .muted { color: var(--muted); }
      .faint { color: var(--faint); font-size: 12px; }
      .pill { display: inline-block; white-space: nowrap; padding: 3px 10px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; border: 1px solid currentColor; }
      .pill.go, .pill.clear { color: var(--clear); }
      .pill.nogo, .pill.adverse { color: var(--adverse); }
      .pill.conditional, .pill.unknown { color: var(--unknown); }
      .pill.insufficient { color: var(--unknown); }
      .pill.not_checked, .pill.not_applicable { color: var(--idle); }
      .banner { border: 1px dashed var(--unknown); color: var(--unknown); border-radius: 12px; padding: 10px 14px; margin-bottom: 14px; font-size: 12px; }
      table { width: 100%; border-collapse: collapse; }
      th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
      td { padding: 8px; border-bottom: 1px solid rgba(255,255,255,0.055); vertical-align: top; }
      tr:last-child td { border-bottom: none; }
      .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 10px; }
      .kv { background: var(--panel-strong); border-radius: 10px; padding: 10px 12px; }
      .kv .k { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
      .kv .v { margin-top: 3px; }
      details { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; background: var(--panel-strong); }
      details > summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
      details > summary::-webkit-details-marker { display: none; }
      .evidence { margin: 8px 0 0; padding-left: 16px; }
      .evidence li { margin-bottom: 3px; font-size: 12px; }
      .tier { font-family: var(--mono); font-size: 10px; color: var(--faint); }
      .limitation { border-left: 3px solid var(--unknown); padding-left: 12px; margin-bottom: 12px; }
      .scopenote { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 12px; margin-top: 4px; }
      .overflow { overflow-x: auto; }
      td.dim { color: var(--idle); }
      @media (prefers-color-scheme: light) {
        :root:not([data-theme="dark"]) {
          color-scheme: light;
          --bg: #fbfbfd; --panel: rgba(10,14,25,0.03); --panel-strong: rgba(10,14,25,0.05);
          --line: rgba(10,14,25,0.12); --ink: #12161f; --muted: rgba(18,22,31,0.68);
          --faint: rgba(18,22,31,0.5); --clear: #14875c; --adverse: #c33a30; --unknown: #9a6b09;
          --idle: rgba(18,22,31,0.35);
        }
      }
    </style>
  </head>
  <body data-path-ready="true">
    <div id="app">
      <div class="card"><div class="muted">Loading…</div></div>
    </div>
    <script src="./assets/example.js"></script>
    <script src="./assets/app.js"></script>
  </body>
</html>
